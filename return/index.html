<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your $5 DJ Pool offer is on the way</title>
  <meta name="description" content="Your private Digital DJ Pool return offer is on the way.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --background: #0C0B0E;
      --foreground: #EDE6DC;
      --muted: #918A82;
      --accent: #D4813A;
      --panel: #151318;
      --border: #28242B;
    }

    body {
      background: var(--background);
      color: var(--foreground);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
    }

    .logo {
      width: auto;
      height: 85px;
      margin-bottom: 40px;
    }

    .check {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid #6A492F;
      border-radius: 50%;
      background: rgba(212, 129, 58, 0.12);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .accent { color: var(--accent); }

    .intro {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .offer {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--foreground);
      font-size: 14px;
      font-weight: 600;
    }

    .offer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .note {
      margin-top: 22px;
      color: #6F6963;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .logo { margin-bottom: 32px; }
      .offer { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/brand/mark-dark.svg" alt="Digital DJ Pool">

    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Your $5 offer is <span class="accent">on the way.</span></h1>
    <p class="intro">Check your inbox for your private Digital DJ Pool return link. It may take a few minutes to arrive.</p>

    <div class="offer">
      <span class="offer-dot" aria-hidden="true"></span>
      <span>$5 first month · then $10/month</span>
    </div>
    <p class="note">No commitment. Cancel anytime.</p>
  </main>
</body>
</html>
