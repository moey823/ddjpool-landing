<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your $5 DJ Pool offer is on the way</title>
  <meta name="description" content="Your private Digital DJ Pool return offer is on the way.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --background: #0C0B0E;
      --foreground: #EDE6DC;
      --muted: #918A82;
      --accent: #D4813A;
      --panel: #151318;
      --border: #28242B;
    }

    body {
      background: var(--background);
      color: var(--foreground);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: auto;
      margin-bottom: 40px;
    }

    .check {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid #6A492F;
      border-radius: 50%;
      background: rgba(212, 129, 58, 0.12);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .accent { color: var(--accent); }

    .intro {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .offer {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--foreground);
      font-size: 14px;
      font-weight: 600;
    }

    .offer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .note {
      margin-top: 22px;
      color: #6F6963;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .logo { margin-bottom: 32px; }
      .offer { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 1000 1185" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital DJ Pool">
      <g transform="translate(0,591.647)">
        <path d="M592.97,296.897 C592.97,460.323 460.228,592.807 296.485,592.807 C132.741,592.807 0,460.323 0,296.897 C0,133.471 132.741,0.988 296.485,0.988 C460.228,0.988 592.97,133.471 592.97,296.897" fill="#EDE6DC"/>
      </g>
      <path d="M517.981,0 C354.275,0 221.578,132.667 221.578,296.32 L221.578,518.561 L369.776,518.561 L369.776,296.32 C369.776,214.494 436.132,148.156 517.981,148.156 C599.831,148.156 666.18,214.494 666.18,296.32 L666.18,370.398 L814.385,370.398 L814.385,296.32 C814.385,132.667 681.68,0 517.981,0" fill="#EDE6DC"/>
      <path d="M740.526,444.316 C639.59,444.316 552.182,501.941 509.281,586.033 C604.32,653.097 666.394,763.7 666.394,888.799 C666.394,909.827 664.615,930.431 661.239,950.503 C686.235,958.51 712.866,962.877 740.526,962.877 C883.83,962.877 1000,846.792 1000,703.6 C1000,560.4 883.83,444.316 740.526,444.316" fill="#D4813A"/>
    </svg>

    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Your $5 offer is <span class="accent">on the way.</span></h1>
    <p class="intro">Check your inbox for your private Digital DJ Pool return link. It may take a few minutes to arrive.</p>

    <div class="offer">
      <span class="offer-dot" aria-hidden="true"></span>
      <span>$5 first month · then $10/month</span>
    </div>
    <p class="note">No commitment. Cancel anytime.</p>
  </main>
</body>
</html>
