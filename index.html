<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital DJ Pool</title>
  <meta name="description" content="Digital DJ Pool — the underground record pool for working DJs. Something big is coming.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0C0B0E;
      color: #EDE6DC;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      width: 80px;
      height: auto;
      margin-bottom: 48px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 16px;
    }

    p {
      color: #918A82;
      font-size: 15px;
      font-weight: 400;
      text-align: center;
    }

    .accent {
      color: #D4813A;
    }

    .confirmed {
      display: none;
    }

    .confirmed.show {
      display: block;
    }

    .default.hide {
      display: none;
    }

    .check {
      color: #D4813A;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 48px;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 1000 1185" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0,591.647)">
      <path d="M592.97,296.897 C592.97,460.323 460.228,592.807 296.485,592.807 C132.741,592.807 0,460.323 0,296.897 C0,133.471 132.741,0.988 296.485,0.988 C460.228,0.988 592.97,133.471 592.97,296.897" fill="#EDE6DC"/>
    </g>
    <path d="M517.981,0 C354.275,0 221.578,132.667 221.578,296.32 L221.578,518.561 L369.776,518.561 L369.776,296.32 C369.776,214.494 436.132,148.156 517.981,148.156 C599.831,148.156 666.18,214.494 666.18,296.32 L666.18,370.398 L814.385,370.398 L814.385,296.32 C814.385,132.667 681.68,0 517.981,0" fill="#EDE6DC"/>
    <path d="M740.526,444.316 C639.59,444.316 552.182,501.941 509.281,586.033 C604.32,653.097 666.394,763.7 666.394,888.799 C666.394,909.827 664.615,930.431 661.239,950.503 C686.235,958.51 712.866,962.877 740.526,962.877 C883.83,962.877 1000,846.792 1000,703.6 C1000,560.4 883.83,444.316 740.526,444.316" fill="#D4813A"/>
  </svg>

  <div class="default">
    <h1>We're rebuilding <span class="accent">everything.</span></h1>
    <p>Digital DJ Pool — something new is coming.</p>
  </div>

  <div class="confirmed">
    <div class="check">&#10003;</div>
    <h1>You're on the <span class="accent">list.</span></h1>
    <p>We'll reach out when the new Digital DJ Pool is ready.</p>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).has('src')) {
      document.querySelector('.default').classList.add('hide');
      document.querySelector('.confirmed').classList.add('show');
    }
  </script>
</body>
</html>
