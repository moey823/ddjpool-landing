<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital DJ Pool</title>
  <meta name="description" content="Digital DJ Pool — the underground record pool for working DJs. Something big is coming.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0C0B0E;
      color: #EDE6DC;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      width: auto;
      height: 95px;
      margin-bottom: 48px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 16px;
    }

    p {
      color: #918A82;
      font-size: 15px;
      font-weight: 400;
      text-align: center;
    }

    .accent {
      color: #D4813A;
    }

    .confirmed {
      display: none;
    }

    .confirmed.show {
      display: block;
    }

    .default.hide {
      display: none;
    }

    .check {
      color: #D4813A;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 48px;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <img class="logo" src="/brand/mark-dark.svg" alt="" aria-hidden="true">

  <div class="default">
    <h1>We're rebuilding <span class="accent">everything.</span></h1>
    <p>Digital DJ Pool — something new is coming.</p>
  </div>

  <div class="confirmed">
    <div class="check">&#10003;</div>
    <h1>You're on the <span class="accent">list.</span></h1>
    <p>We'll reach out when the new Digital DJ Pool is ready.</p>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).has('src')) {
      document.querySelector('.default').classList.add('hide');
      document.querySelector('.confirmed').classList.add('show');
    }
  </script>
</body>
</html>
